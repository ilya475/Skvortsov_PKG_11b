<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Микро-тесты — вариант 8</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0;padding:30px}.box{max-width:900px;margin:auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:24px}h1{margin-top:0}.ok{color:#18844a}.fail{color:#b12c2c}li{padding:7px 0}a{display:inline-block;margin-bottom:20px}
  </style>
</head>
<body>
<div class="box">
  <a href="../index.html">← Вернуться к приложению</a>
  <h1>Автоматические микро-тесты</h1>
  <p>Тестируется собственная математика из <code>model.js</code>, без библиотек цветового преобразования.</p>
  <div id="summary"></div>
  <ol id="results"></ol>
</div>
<script type="module">
import { gammaDecode, gammaEncode, rgbToXyz, xyzToRgb, rgbToHsv, hsvToRgb, xyzToHsv, hsvToXyz, buildRgbToXyzMatrix, nearlyEqual } from '../js/model.js';

const tests = [];
function test(name, fn){
  try { fn(); tests.push({name, ok:true}); }
  catch(e) { tests.push({name, ok:false, error:e.message}); }
}
function assert(cond, msg){ if(!cond) throw new Error(msg); }
function arrNear(a,b,eps=.02){ return a.length===b.length && a.every((v,i)=>Math.abs(v-b[i])<=eps); }

test('Гамма: 0 → 0 и 255 → 1', () => {
  assert(gammaDecode(0) === 0, 'gammaDecode(0)');
  assert(nearlyEqual(gammaDecode(255),1,1e-12), 'gammaDecode(255)');
});

test('Гамма: обратное преобразование', () => {
  [0,.01,.1,.5,1].forEach(v => assert(Math.abs(gammaDecode(gammaEncode(v)*255))-v < 1e-6, `v=${v}`));
});

test('D65 матрица RGB→XYZ имеет правильную форму', () => {
  const m=buildRgbToXyzMatrix('D65');
  assert(m.length===3 && m.every(r=>r.length===3), 'матрица не 3×3');
  assert(Math.abs(m[0][0]-0.412453)<0.001, 'Xr');
  assert(Math.abs(m[1][1]-0.715160)<0.001, 'Yg');
  assert(Math.abs(m[2][2]-0.950227)<0.001, 'Zb');
});

test('RGB(255,0,0) → XYZ D65', () => {
  const xyz=rgbToXyz([255,0,0],'D65');
  assert(arrNear(xyz,[41.2453,21.2671,1.9334],.02), JSON.stringify(xyz));
});

test('Белый RGB(255,255,255) → около точки белого D65', () => {
  const xyz=rgbToXyz([255,255,255],'D65');
  assert(arrNear(xyz,[95.047,100,108.883],.05), JSON.stringify(xyz));
});

test('XYZ → RGB → XYZ сохраняет цвет в пределах округления', () => {
  const rgb=[37,148,211];
  const xyz=rgbToXyz(rgb,'D65');
  const back=xyzToRgb(xyz,'D65','clipping').rgb;
  assert(arrNear(back,rgb,.05), JSON.stringify(back));
});

test('RGB красный → HSV = 0°, 100%, 100%', () => {
  const hsv=rgbToHsv([255,0,0]);
  assert(arrNear(hsv,[0,100,100],1e-9), JSON.stringify(hsv));
});

test('HSV(120,100,100) → RGB(0,255,0)', () => {
  const rgb=hsvToRgb([120,100,100]);
  assert(arrNear(rgb,[0,255,0],1e-9), JSON.stringify(rgb));
});

test('HSV → RGB → HSV сохраняет цвет', () => {
  const hsv=[210,65,83];
  const back=rgbToHsv(hsvToRgb(hsv));
  assert(arrNear(back,hsv,.001), JSON.stringify(back));
});

test('Прямой XYZ → HSV даёт тот же цветовой результат', () => {
  const xyz=rgbToXyz([37,148,211],'D65');
  const hsv=xyzToHsv(xyz,'D65');
  assert(arrNear(hsv,rgbToHsv([37,148,211]),.001), JSON.stringify(hsv));
});

test('Прямой HSV → XYZ и обратно сохраняет HSV', () => {
  const hsv=[210,65,83];
  const xyz=hsvToXyz(hsv,'D65');
  const back=xyzToHsv(xyz,'D65');
  assert(arrNear(back,hsv,.001), JSON.stringify(back));
});

test('Для D50 и E матрицы отличаются от D65', () => {
  const a=buildRgbToXyzMatrix('D65');
  const b=buildRgbToXyzMatrix('D50');
  const c=buildRgbToXyzMatrix('E');
  assert(Math.abs(a[0][0]-b[0][0])>.001,'D50 не пересчитан');
  assert(Math.abs(a[1][1]-c[1][1])>.001,'E не пересчитан');
});

const list=document.getElementById('results');
let passed=0;
tests.forEach(t=>{const li=document.createElement('li');li.className=t.ok?'ok':'fail';li.textContent=(t.ok?'✓ ':'✗ ')+t.name+(t.ok?'':` — ${t.error}`);list.appendChild(li);if(t.ok)passed++;});
document.getElementById('summary').innerHTML=`<h2>${passed}/${tests.length} тестов пройдено</h2>`;
</script>
</body>
</html>
